[project]
name = "emotionshift"
version = "0.1.0"
description = "EE6405 group project: emotion shifts in conversation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["emotionshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
